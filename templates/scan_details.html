<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WebGuard | Scan Details</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">
            <h1>WebGuard</h1>

            <span>
                Security Scanner
            </span>
        </div>

        <nav class="nav">

            <a href="/">
                Dashboard
            </a>

            <a
                href="/history"
            >
                Scan History
            </a>

            <a href="#">
                Reports
            </a>

        </nav>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <a
            href="/history"
            class="back"
        >
            ← Back to Scan History
        </a>


        <header class="page-header">

            <div>

                <h2>
                    Scan Details
                </h2>

                <p>
                    Detailed security assessment
                    and vulnerability analysis.
                </p>

            </div>

            <div
                id="riskBadge"
                class="risk-badge risk-low"
            >
                Loading
            </div>

        </header>


        <!-- =========================
             TARGET
        ========================= -->

        <section
            id="targetCard"
            class="target-card"
        >
            Loading scan information...
        </section>


        <!-- =========================
             METRICS
        ========================= -->

        <section class="metrics">

            <div class="metric-card">

                <div class="metric-label">
                    Endpoints
                </div>

                <div
                    class="metric-value"
                    id="endpointCount"
                >
                    —
                </div>

            </div>


            <div class="metric-card">

                <div class="metric-label">
                    Vulnerabilities
                </div>

                <div
                    class="metric-value"
                    id="vulnerabilityCount"
                >
                    —
                </div>

            </div>


            <div class="metric-card">

                <div class="metric-label">
                    High Risk
                </div>

                <div
                    class="metric-value"
                    id="highRiskCount"
                >
                    —
                </div>

            </div>


            <div class="metric-card">

                <div class="metric-label">
                    Security Score
                </div>

                <div
                    class="metric-value"
                    id="securityScore"
                >
                    —
                </div>

            </div>

        </section>


        <!-- =========================
             ENDPOINTS
        ========================= -->

        <section class="section">

            <div class="section-header">

                <h3>
                    Discovered Endpoints
                </h3>

                <span
                    class="section-count"
                    id="endpointLabel"
                >
                    —
                </span>

            </div>

            <div id="endpoints"></div>

        </section>


        <!-- =========================
             FINDINGS
        ========================= -->

        <section class="section">

            <div class="section-header">

                <h3>
                    Security Findings
                </h3>

                <span
                    class="section-count"
                    id="findingLabel"
                >
                    —
                </span>

            </div>

            <div id="findings"></div>

        </section>

    </main>

</div>


<script>

    /* =========================
       SCAN ID FROM FLASK
    ========================= */

    const scanId = (() => {
        const match = window.location.pathname.match(/\/scan\/(\d+)/);

        if (match) {
            return Number(match[1]);
        }

        const templateId = "{{ scan_id|default('') }}";

        return templateId ? Number(templateId) : NaN;
    })();


    /* =========================
       LOAD SCAN
    ========================= */

    async function loadScan() {

        try {

            if (!scanId || Number.isNaN(scanId)) {
                throw new Error("Invalid scan ID.");
            }

            const response = await fetch(
                `/api/history/${scanId}`
            );

            if (!response.ok) {
                throw new Error(
                    `Server returned HTTP ${response.status}.`
                );
            }

            const data = await response.json();

            if (!data.success) {
                throw new Error(
                    data.error ||
                    "Unable to load scan."
                );
            }

            displayScan(data.scan);

        } catch (error) {

            document.getElementById(
                "targetCard"
            ).innerHTML = `

                <div class="state">

                    <div class="state-icon">
                        ⚠
                    </div>

                    <h3>
                        Unable to Load Scan
                    </h3>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                </div>

            `;

            document.getElementById(
                "riskBadge"
            ).textContent = "Error";

            document.getElementById(
                "riskBadge"
            ).className =
                "risk-badge risk-high";

        }

    }


    /* =========================
       DISPLAY SCAN
    ========================= */

    function displayScan(scan) {

        const risk =
            scan.risk_level || "Unknown";

        const score =
            scan.security_score ?? "—";

        const findings =
            Array.isArray(scan.findings)
                ? scan.findings
                : [];

        const endpoints =
            Array.isArray(scan.endpoints)
                ? scan.endpoints
                : (
                    Array.isArray(
                        scan.discovered_endpoints
                    )
                        ? scan.discovered_endpoints
                        : []
                );


        /* =========================
           TARGET
        ========================= */

        document.getElementById(
            "targetCard"
        ).innerHTML = `

            <div class="target-label">
                Target
            </div>

            <div class="target-url">
                ${escapeHTML(
                    scan.target || "Unknown"
                )}
            </div>

            <div class="scan-time">

                Scan ID #${escapeHTML(
                    String(scan.id ?? scanId)
                )}

                &nbsp; • &nbsp;

                ${escapeHTML(
                    scan.scan_time || "Unknown"
                )}

            </div>

        `;


        /* =========================
           METRICS
        ========================= */

        document.getElementById(
            "endpointCount"
        ).textContent =
            scan.endpoints_count ??
            endpoints.length;


        document.getElementById(
            "vulnerabilityCount"
        ).textContent =
            scan.vulnerability_count ??
            findings.length;


        document.getElementById(
            "highRiskCount"
        ).textContent =
            scan.high_risk_count ?? 0;


        document.getElementById(
            "securityScore"
        ).textContent =
            `${score}/100`;


        /* =========================
           RISK BADGE
        ========================= */

        const badge =
            document.getElementById(
                "riskBadge"
            );

        badge.textContent = risk;

        badge.className =
            "risk-badge " +
            getRiskClass(risk);


        /* =========================
           ENDPOINTS
        ========================= */

        renderEndpoints(
            endpoints
        );


        /* =========================
           FINDINGS
        ========================= */

        renderFindings(
            findings
        );

    }


    /* =========================
       ENDPOINTS
    ========================= */

    function renderEndpoints(
        endpoints
    ) {

        document.getElementById(
            "endpointLabel"
        ).textContent =
            `${endpoints.length} discovered`;


        if (!endpoints.length) {

            document.getElementById(
                "endpoints"
            ).innerHTML = `

                <div class="state">

                    <div class="state-icon">
                        ◫
                    </div>

                    <h3>
                        No Endpoints
                    </h3>

                    <p>
                        No endpoint information
                        was stored for this scan.
                        New scans will record every discovered endpoint.
                    </p>

                </div>

            `;

            return;
        }


        document.getElementById(
            "endpoints"
        ).innerHTML =

            endpoints.map(
                endpoint => {

                    const endpointObject =
                        endpoint &&
                        typeof endpoint === "object"
                            ? endpoint
                            : null;

                    const url =
                        typeof endpoint === "string"
                            ? endpoint
                            : endpointObject?.url;

                    const status =
                        endpointObject
                            ? endpointObject.status_code
                            : "—";

                    return `

                        <div class="endpoint">

                            <span
                                class="endpoint-url"
                            >
                                ${escapeHTML(
                                    url || "Unknown"
                                )}
                            </span>

                            <span
                                class="endpoint-status"
                            >
                                ${escapeHTML(
                                    String(
                                        status ?? "—"
                                    )
                                )}
                            </span>

                        </div>

                    `;

                }
            ).join("");

    }


    /* =========================
       FINDINGS
    ========================= */

    function renderFindings(
        findings
    ) {

        document.getElementById(
            "findingLabel"
        ).textContent =
            `${findings.length} detected`;


        if (!findings.length) {

            document.getElementById(
                "findings"
            ).innerHTML = `

                <div class="state">

                    <div class="state-icon">
                        ✓
                    </div>

                    <h3>
                        No Vulnerabilities Detected
                    </h3>

                    <p>
                        The scan did not record
                        any security findings.
                    </p>

                </div>

            `;

            return;
        }


        document.getElementById(
            "findings"
        ).innerHTML =

            findings.map(
                finding => {

                    const severity =
                        finding.severity ||
                        "Unknown";

                    const parameter =
                        finding.parameter ||
                        "None";

                    const affectedEndpoints =
                        Array.isArray(finding.affected_endpoints)
                            ? finding.affected_endpoints
                            : [];

                    const url =
                        finding.url ||
                        finding.affected_endpoint ||
                        affectedEndpoints[0] ||
                        "Unknown";

                    const severityClass =
                        String(
                            severity
                        )
                        .toLowerCase()
                        .replace(
                            /[^a-z]/g,
                            ""
                        );

                    return `

                        <article
                            class="finding"
                        >

                            <div
                                class="finding-top"
                            >

                                <div>

                                    <h4>
                                        ${escapeHTML(
                                            finding.name ||
                                            finding.type ||
                                            "Security Finding"
                                        )}
                                    </h4>

                                    <p
                                        class="finding-description"
                                    >
                                        ${escapeHTML(
                                            finding.description ||
                                            "No description available."
                                        )}
                                    </p>

                                </div>


                                <span
                                    class="severity ${severityClass}"
                                >
                                    ${escapeHTML(
                                        severity
                                    )}
                                </span>

                            </div>


                            <div
                                class="finding-meta"
                            >

                                <p>

                                    <strong>
                                        Affected Endpoint:
                                    </strong>

                                    ${escapeHTML(
                                        url
                                    )}

                                </p>


                                <p>

                                    <strong>
                                        Parameter:
                                    </strong>

                                    ${escapeHTML(
                                        parameter
                                    )}

                                </p>

                                ${
                                    affectedEndpoints.length > 1
                                        ? `
                                            <p>
                                                <strong>
                                                    Affected Endpoints:
                                                </strong>
                                                ${escapeHTML(
                                                    affectedEndpoints.join(" • ")
                                                )}
                                            </p>
                                          `
                                        : ""
                                }


                                <p>

                                    <strong>
                                        Detection:
                                    </strong>

                                    ${escapeHTML(
                                        finding.detection ||
                                        "Automated analysis"
                                    )}

                                </p>


                                <p>

                                    <strong>
                                        Recommendation:
                                    </strong>

                                    ${escapeHTML(
                                        finding.recommendation ||
                                        "Review and remediate this finding."
                                    )}

                                </p>

                            </div>

                        </article>

                    `;

                }
            ).join("");

    }


    /* =========================
       RISK CLASS
    ========================= */

    function getRiskClass(
        risk
    ) {

        switch (
            String(risk).toLowerCase()
        ) {

            case "critical":
                return "risk-high";

            case "high":
                return "risk-high";

            case "medium":
                return "risk-medium";

            case "low":
                return "risk-low";

            case "secure":
            case "none":
                return "risk-secure";

            default:
                return "risk-low";

        }

    }


    /* =========================
       HTML ESCAPING
    ========================= */

    function escapeHTML(
        value
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            String(value);

        return div.innerHTML;

    }


    /* =========================
       START
    ========================= */

    loadScan();

</script>

</body>

</html>
